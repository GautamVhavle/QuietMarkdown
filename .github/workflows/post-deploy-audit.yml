name: Post-deploy production audit

# After CI passes on main, this proves production actually serves the
# pushed commit, then audits the LIVE site (Lighthouse SEO + crawler
# checks). If a VERCEL_TOKEN secret is configured, it first triggers the
# Vercel production deploy itself; otherwise it verifies Vercel's own
# git-integration deploy.

on:
  workflow_run:
    workflows: ['Verify QuietMarkdown']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  audit-production:
    name: Deploy and audit production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      PROD_URL: https://quietmark.vercel.app
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Trigger Vercel production deploy
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npx vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          GIT_SHA: ${{ env.EXPECTED_SHA }}

      - name: Wait for production to serve this commit
        run: |
          for attempt in $(seq 1 45); do
            SERVED=$(curl -fsSL "$PROD_URL/?audit=$RANDOM" | grep -o 'x-build-sha" content="[a-f0-9]*' | cut -d'"' -f4 || true)
            echo "attempt $attempt: production serves '${SERVED:-nothing}', expecting '$EXPECTED_SHA'"
            if [ "$SERVED" = "$EXPECTED_SHA" ]; then
              echo "Production is serving the pushed commit."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Production did not serve commit $EXPECTED_SHA within 15 minutes."
          exit 1

      - name: Crawler-view smoke checks against production
        run: |
          HTML=$(curl -fsSL "$PROD_URL")
          echo "$HTML" | grep -q '<title>Free Online Markdown Editor' || { echo '::error::title missing'; exit 1; }
          echo "$HTML" | grep -q 'FAQPage' || { echo '::error::FAQ schema missing'; exit 1; }
          echo "$HTML" | grep -q 'seo-static' || { echo '::error::prerendered content missing'; exit 1; }
          curl -fsSL "$PROD_URL/favicon.svg" | grep -q 'asymmetric bottom-right corner' \
            || { echo '::error::favicon is stale'; exit 1; }
          echo "Crawler view verified."

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Interactive smoke checks against production
        run: |
          cat > /tmp/smoke.mjs << 'SMOKE'
          import { chromium } from '@playwright/test'
          const url = process.env.PROD_URL
          const browser = await chromium.launch()
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } })
          const errors = []
          page.on('pageerror', (e) => errors.push(String(e)))
          await page.goto(url, { waitUntil: 'networkidle' })
          await page.evaluate(() => localStorage.clear())
          await page.reload({ waitUntil: 'networkidle' })
          await page.waitForTimeout(2500)
          const results = {
            mermaidRenders: await page.locator('.markdown-body .mermaid svg').count(),
            documentsMenu: await page.getByRole('button', { name: 'Documents' }).isVisible(),
            offlineCapable: 'serviceWorker' in navigator,
            consoleErrors: errors.length,
          }
          await page.getByRole('button', { name: 'Documents' }).click()
          results.clearAction = await page.getByRole('button', { name: /Clear page/ }).isVisible()
          console.log(JSON.stringify(results))
          const ok = results.mermaidRenders >= 1 && results.documentsMenu && results.clearAction && results.consoleErrors === 0
          await browser.close()
          if (!ok) process.exit(1)
          SMOKE
          PROD_URL="$PROD_URL" node /tmp/smoke.mjs

      - name: Lighthouse SEO audit of production
        run: |
          npx --yes lighthouse "$PROD_URL" \
            --only-categories=seo,accessibility,best-practices \
            --output=json --output-path=/tmp/lh.json \
            --chrome-flags="--headless=new --no-sandbox" --quiet
          node -e "
            const r = require('/tmp/lh.json');
            const scores = Object.fromEntries(Object.entries(r.categories).map(([k, c]) => [k, Math.round(c.score * 100)]));
            console.log('Live scores:', scores);
            for (const [cat, min] of [['seo', 100], ['accessibility', 100], ['best-practices', 90]]) {
              if (scores[cat] < min) { console.error(\`\${cat} scored \${scores[cat]}, below \${min}\`); process.exit(1); }
            }
          "
