name: Post-deploy production audit

# After CI passes on main, this proves production actually serves the
# pushed commit, then audits the LIVE site (Lighthouse SEO + crawler
# checks). If a VERCEL_TOKEN secret is configured, it first triggers the
# Vercel production deploy itself; otherwise it verifies Vercel's own
# git-integration deploy.

on:
  workflow_run:
    workflows: ['Verify QuietMarkdown']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-production:
    name: Deploy and audit production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      PROD_URL: https://quietmark.vercel.app
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Trigger Vercel production deploy
        # secrets are not readable in step-level if:, so the presence
        # check happens here in shell instead.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GIT_SHA: ${{ env.EXPECTED_SHA }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN secret configured - relying on Vercel's own git-integration deploy."
            exit 0
          fi
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Wait for production to serve this commit
        run: |
          for attempt in $(seq 1 45); do
            SERVED=$(curl -fsSL "$PROD_URL/?audit=$RANDOM" | grep -o 'x-build-sha" content="[a-f0-9]*' | cut -d'"' -f3 || true)
            echo "attempt $attempt: production serves '${SERVED:-nothing}', expecting '$EXPECTED_SHA'"
            if [ "$SERVED" = "$EXPECTED_SHA" ]; then
              echo "Production is serving the pushed commit."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Production did not serve commit $EXPECTED_SHA within 15 minutes."
          exit 1

      - name: Crawler-view smoke checks against production
        run: |
          HTML=$(curl -fsSL "$PROD_URL")
          echo "$HTML" | grep -q '<title>Free Online Markdown Editor' || { echo '::error::title missing'; exit 1; }
          echo "$HTML" | grep -q 'FAQPage' || { echo '::error::FAQ schema missing'; exit 1; }
          echo "$HTML" | grep -q 'seo-static' || { echo '::error::prerendered content missing'; exit 1; }
          curl -fsSL "$PROD_URL/favicon.svg" | grep -q 'asymmetric bottom-right corner' \
            || { echo '::error::favicon is stale'; exit 1; }
          echo "Crawler view verified."

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Interactive smoke checks against production
        env:
          SMOKE_B64: 
        run: |
          echo "$SMOKE_B64" | base64 -d > ./smoke-prod.mjs
          PROD_URL="$PROD_URL" node ./smoke-prod.mjs
        # Script lives inside the checkout so ESM resolves @playwright/test.

      - name: Lighthouse SEO audit of production
        run: |
          CHROME_PATH="$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -1)"
          echo "Lighthouse Chromium: $CHROME_PATH"
          npx --yes lighthouse "$PROD_URL" \
            --only-categories=seo,accessibility,best-practices \
            --output=json --output-path=/tmp/lh.json \
            --chrome-flags="--headless --no-sandbox" --quiet
          node -e "
            const r = require('/tmp/lh.json');
            const scores = Object.fromEntries(Object.entries(r.categories).map(([k, c]) => [k, Math.round(c.score * 100)]));
            console.log('Live scores:', scores);
            let failed = false;
            for (const [cat, min] of [['seo', 100], ['accessibility', 100], ['best-practices', 90]]) {
              if (scores[cat] >= min) continue;
              failed = true;
              console.error(\`\${cat} scored \${scores[cat]}, below \${min}. Failing audits:\`);
              for (const ref of r.categories[cat].auditRefs || []) {
                const a = r.audits[ref.id];
                if (a && a.score !== null && a.score < 1) console.error(\` - \${ref.id}: \${a.title} (score \${a.score})\`);
              }
            }
            process.exit(failed ? 1 : 0);
          "
