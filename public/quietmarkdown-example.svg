<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">QuietMarkdown document illustration</title>
  <desc id="description">A warm paper document with a QuietMarkdown Q seal</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfaf5"/>
      <stop offset="1" stop-color="#ebe7dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#282723" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="88" r="150" fill="#d85b3f" fill-opacity=".1"/>
  <circle cx="133" cy="505" r="132" fill="#4f8662" fill-opacity=".1"/>
  <g filter="url(#shadow)" transform="translate(351 52) rotate(3 250 230)">
    <rect width="500" height="458" rx="10" fill="#fffefa"/>
    <rect x="52" y="60" width="170" height="20" rx="10" fill="#282723"/>
    <rect x="52" y="108" width="290" height="9" rx="4.5" fill="#c5c0b6"/>
    <rect x="52" y="139" width="365" height="9" rx="4.5" fill="#d8d4cc"/>
    <rect x="52" y="170" width="331" height="9" rx="4.5" fill="#d8d4cc"/>
    <rect x="52" y="226" width="114" height="13" rx="6.5" fill="#d85b3f"/>
    <rect x="52" y="269" width="397" height="8" rx="4" fill="#d8d4cc"/>
    <rect x="52" y="298" width="361" height="8" rx="4" fill="#d8d4cc"/>
    <rect x="52" y="327" width="387" height="8" rx="4" fill="#d8d4cc"/>
    <rect x="52" y="384" width="174" height="9" rx="4.5" fill="#c5c0b6"/>
  </g>
  <g transform="translate(218 187)">
    <rect width="110" height="110" rx="31" fill="#282723"/>
    <text x="55" y="76" text-anchor="middle" fill="#fffefa" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="600">Q</text>
  </g>
</svg>
