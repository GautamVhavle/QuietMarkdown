<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f6f3" />
    <title>Page not found | QuietMarkdown</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color: #242421; background: #f7f6f3; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-width: 320px; min-height: 100vh; margin: 0; place-items: center; background: radial-gradient(circle at 86% 14%, rgba(216, 91, 63, .11), transparent 25%), #f7f6f3; }
      main { width: min(620px, calc(100% - 48px)); text-align: center; }
      .mark { display: grid; width: 54px; height: 54px; margin: 0 auto 28px; place-items: center; border-radius: 17px 17px 17px 5px; background: #242421; color: #fffefa; font-family: Georgia, "Times New Roman", serif; font-size: 34px; font-weight: 600; }
      .eyebrow { color: #d85b3f; font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
      h1 { max-width: 540px; margin: 12px auto 16px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(42px, 7vw, 72px); font-weight: 500; letter-spacing: -.055em; line-height: .98; }
      p { max-width: 430px; margin: 0 auto; color: #67655f; font-size: 16px; line-height: 1.65; }
      a { display: inline-flex; align-items: center; justify-content: center; margin-top: 30px; border-radius: 9px; padding: 12px 16px; background: #242421; color: #fffefa; font-size: 14px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 12px rgba(36, 36, 33, .16); }
      a:hover { background: #d85b3f; }
      footer { margin-top: 48px; color: #928f87; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">Q</div>
      <div class="eyebrow">404 · Page not found</div>
      <h1>This page escaped the draft.</h1>
      <p>The link may be outdated or the address may be incomplete. QuietMarkdown is still ready when you are.</p>
      <a href="/">Open QuietMarkdown</a>
      <footer>Private Markdown writing and beautiful exports.</footer>
    </main>
  </body>
</html>
